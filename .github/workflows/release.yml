name: Release

# Versioning is automatic: semantic-release reads the Conventional Commits since the last tag,
# works out whether that is a patch, minor or major, and cuts the release. Nobody edits a
# version number by hand.
#
# It runs in two jobs: the first decides the version and creates the release, the second builds
# the archive and attaches it. Both are hosted. Building needs KSA's assemblies, which are not
# redistributable and so live in the private repository LaurensDeV/ksa-game-assemblies, checked
# out here with a read-only deploy key (the KSA_ASSEMBLIES_KEY secret).
#
# Without that secret the release is still cut - version, changelog, notes - just with no binary
# attached. ./tools/publish-release.sh attaches one afterwards from a machine that has KSA.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  version:
    name: Version and changelog
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      notes: ${{ steps.semantic.outputs.new_release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs the whole history to find the last release and everything
          # since it. A shallow clone silently produces a first release every time.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/exec@6
            @semantic-release/git@10
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [[ "${{ steps.semantic.outputs.new_release_published }}" == "true" ]]; then
            echo "released ${{ steps.semantic.outputs.new_release_version }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no release: nothing since the last tag warrants one" >> "$GITHUB_STEP_SUMMARY"
          fi

  artifact:
    name: Build and attach the mod
    needs: version
    if: ${{ needs.version.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    env:
      HAVE_KEY: ${{ secrets.KSA_ASSEMBLIES_KEY != '' }}
      KSA_DLL_DIR: ${{ github.workspace }}/.ksa-assemblies/current/dll
      # Publishing to SpaceDock needs all three. Absent, the step is skipped with a notice rather
      # than failing: a fork cannot have them, and the GitHub release is the real artefact either
      # way. SPACEDOCK_MOD_ID and SPACEDOCK_USERNAME are repository *variables*, the password a
      # secret.
      HAVE_SPACEDOCK: ${{ vars.SPACEDOCK_MOD_ID != '' && vars.SPACEDOCK_USERNAME != '' && secrets.SPACEDOCK_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag semantic-release just pushed, so the archive matches the release exactly
          # rather than whatever main has drifted to since.
          ref: v${{ needs.version.outputs.version }}

      - name: Check out the KSA assemblies
        if: env.HAVE_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: LaurensDeV/ksa-game-assemblies
          path: .ksa-assemblies
          ssh-key: ${{ secrets.KSA_ASSEMBLIES_KEY }}
          persist-credentials: false

      - name: Cannot build without the assemblies
        if: env.HAVE_KEY != 'true'
        run: |
          echo "::warning::KSA_ASSEMBLIES_KEY is not set; the release has no binary attached."
          echo "Run ./tools/publish-release.sh from a machine with KSA to add one."

      - name: Assemblies match the lock
        if: env.HAVE_KEY == 'true'
        run: ./tools/check-assemblies.sh .ksa-assemblies/current/dll

      - uses: actions/setup-dotnet@v4
        if: env.HAVE_KEY == 'true'
        with:
          dotnet-version: "10.0.x"

      # A release that fails its own checks is not a release.
      - name: Test
        if: env.HAVE_KEY == 'true'
        run: dotnet test tests/KSArmory.Tests/KSArmory.Tests.csproj --nologo

      - name: Validate parts and launch geometry
        if: env.HAVE_KEY == 'true'
        run: ./tools/validate-parts.py --offline

      - name: Check the mesh
        if: env.HAVE_KEY == 'true'
        run: ./tools/model/checkmesh.py src/KSArmory/Meshes/AirDefence_MeshAtlas.glb

      - name: Package
        if: env.HAVE_KEY == 'true'
        run: ./tools/package.sh --version "${{ needs.version.outputs.version }}"

      - name: Attach to the release
        if: env.HAVE_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: dist/KSArmory-${{ needs.version.outputs.version }}.zip
          append_body: true
          body: |

            ---

            Drop the `KSArmory` folder into your KSA user directory's `mods/`, register it in
            `manifest.toml`, and launch through StarMap. See the README for the full guide.

            Works on Windows and Linux — the mod is a portable .NET assembly.

            Release build: no debug symbols, log starts at INFO. Tick **Verbose log** in the
            panel if you are reporting a bug.

      # SpaceDock is where most people will actually get this, so the release is not finished
      # until it is there. Adapted from AMPW-german/KSAGEffects, which worked the API out first.
      - name: Publish to SpaceDock
        if: env.HAVE_KEY == 'true' && env.HAVE_SPACEDOCK == 'true'
        env:
          SPACEDOCK_USERNAME: ${{ vars.SPACEDOCK_USERNAME }}
          SPACEDOCK_PASSWORD: ${{ secrets.SPACEDOCK_PASSWORD }}
          MOD_ID: ${{ vars.SPACEDOCK_MOD_ID }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
          # The KSA build SpaceDock lists this against. Taken from ksa-assemblies.lock, which is
          # the build the mod was compiled and checked against, so the compatibility claimed on
          # SpaceDock cannot drift from the one CI enforced. Override only if SpaceDock does not
          # yet list that build.
          GAME_VERSION_OVERRIDE: ${{ vars.SPACEDOCK_GAME_VERSION }}
        run: |
          set -euo pipefail

          version="${GAME_VERSION_OVERRIDE:-$(awk '/^build /{print $2}' ksa-assemblies.lock)}"
          if [[ -z "$version" ]]; then
            echo "::error::no KSA version: ksa-assemblies.lock has no build line"
            exit 1
          fi

          zip="dist/KSArmory-${VERSION}.zip"
          [[ -f "$zip" ]] || { echo "::error::$zip was not built"; exit 1; }

          printf '%s' "$NOTES" > spacedock-changelog.md

          # -f so a rejected login is a failure here rather than a confusing one on the upload,
          # where the cookie jar would simply be empty.
          curl -fsS --form-string "username=$SPACEDOCK_USERNAME" \
                    --form-string "password=$SPACEDOCK_PASSWORD" \
                    -c ./spacedock-cookies \
                    https://spacedock.info/api/login > /dev/null

          curl -fsS -b ./spacedock-cookies \
                    --form-string "version=$VERSION" \
                    -F "changelog=<spacedock-changelog.md" \
                    --form-string "game-version=$version" \
                    --form-string "notify-followers=yes" \
                    -F "zipball=@$zip" \
                    "https://spacedock.info/api/mod/${MOD_ID}/update"

          echo "published $VERSION to SpaceDock for KSA $version" >> "$GITHUB_STEP_SUMMARY"

      - name: SpaceDock not configured
        if: env.HAVE_KEY == 'true' && env.HAVE_SPACEDOCK != 'true'
        run: |
          echo "::notice::SpaceDock upload skipped. Set the repository variables"
          echo "::notice::SPACEDOCK_MOD_ID and SPACEDOCK_USERNAME, and the secret SPACEDOCK_PASSWORD."

