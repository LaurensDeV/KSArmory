name: CI

# Why this looks the way it does
# ------------------------------
# Building this mod needs KSA's own assemblies (KSA.dll, Brutal.Core.Numerics.dll and friends).
# They are not redistributable, so Import/ is gitignored and a GitHub-hosted runner has no way
# to obtain them. The C# tests need them too - they reference Brutal.Core.Numerics for double3.
#
# They are kept in the private repository LaurensDeV/ksa-game-assemblies and checked out here
# with a read-only deploy key (the KSA_ASSEMBLIES_KEY secret). Keeping your own licensed copy
# privately is fine; publishing it is not, which is why it is not in this repository.
#
# Without that secret - a fork, say - the build job is skipped and the tooling job still runs,
# so CI stays meaningful rather than failing on something a contributor cannot fix.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conventional Commits
        # The same script the local commit-msg hook runs, so CI and the hook cannot disagree
        # about what is legal. A message semantic-release cannot parse produces no release and
        # never reaches the changelog, and does so silently — hence checking it here too.
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ || -z "${{ github.event.before }}" ]]; then
            # New branch, or a manual run: there is no meaningful "before", so check the tip.
            range="${{ github.sha }}~1..${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "checking $range"
          ./tools/check-commit-msg.sh --range "$range"

  tooling:
    name: Tooling and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Python tooling compiles
        run: python -m compileall -q tools

      - name: Shell tooling is sane
        # -S warning on purpose: at info level shellcheck flags every `source tools/env.sh`
        # as unfollowable, which it is, and that would fail the build on nothing.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning tools/*.sh tools/model/*.sh

      - name: Sim/ is free of KSA types
        run: ./tools/check-boundary.sh

      - name: Part XML is well formed
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          for path in sorted(Path("src/AirDefence").glob("AirDefence*.xml")):
              ET.parse(path)
              print(f"  {path} ok")
          PY

      - name: Asset paths resolve, case-exactly
        # Runs on Linux on purpose. KSA runs on Linux too, and Linux filesystems are
        # case-sensitive — so a `Textures/airdefence_diffuse.png` typo would load fine on a
        # Windows machine and leave the part untextured on someone else's. Catching that needs
        # a case-sensitive filesystem, which is exactly what this runner is.
        run: ./tools/validate-parts.py --offline

      - name: Mesh has no z-fighting or degenerate UVs
        # The two defects that only show up in game, and never in a Blender preview.
        run: ./tools/model/checkmesh.py src/AirDefence/Meshes/AirDefence_MeshAtlas.glb

      - name: Textures are reproducible
        # If the committed PNGs do not match what palette.py generates, someone edited them by
        # hand and the next model build will silently revert it. Compares pixels rather than
        # file bytes: PNG encoders differ between Pillow versions, and a byte comparison would
        # fail here purely because the runner's Pillow is not the author's.
        run: ./tools/model/palette.py --check

      - name: No binaries or build artefacts committed
        run: |
          if git ls-files | grep -E '\.(dll|pdb)$'; then
            echo "::error::game assemblies must not be committed - see .gitignore"
            exit 1
          fi
          # .gitignore does not untrack what is already tracked, so a file committed before its
          # rule existed stays in the repository forever without anyone noticing. That is exactly
          # how tools/__pycache__/meshinfo.cpython-312.pyc survived being ignored.
          if git ls-files | grep -E '(^|/)__pycache__/|\.pyc$'; then
            echo "::error::compiled Python must not be committed - see .gitignore"
            exit 1
          fi
          echo "no binaries or build artefacts tracked"

  build:
    name: Build and test
    runs-on: ubuntu-latest
    # secrets.* cannot be used directly in a job-level if:, so surface it through env first.
    env:
      HAVE_KEY: ${{ secrets.KSA_ASSEMBLIES_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the KSA assemblies
        if: env.HAVE_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: LaurensDeV/ksa-game-assemblies
          path: .ksa-assemblies
          ssh-key: ${{ secrets.KSA_ASSEMBLIES_KEY }}
          persist-credentials: false

      - name: Skip notice
        if: env.HAVE_KEY != 'true'
        run: |
          echo "::notice::KSA_ASSEMBLIES_KEY is not set, so the mod cannot be compiled here."
          echo "The tooling job still ran. See CLAUDE.md for why the assemblies are not public."

      - name: Assemblies match the lock
        # Guards against CI compiling against a different KSA build from the developer who
        # wrote the code. ksa-assemblies.lock records the expected digests; a KSA update that
        # refreshed one side and not the other fails here instead of silently.
        if: env.HAVE_KEY == 'true'
        run: ./tools/check-assemblies.sh .ksa-assemblies/current/dll

      - uses: actions/setup-dotnet@v4
        if: env.HAVE_KEY == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Build
        if: env.HAVE_KEY == 'true'
        env:
          KSA_DLL_DIR: ${{ github.workspace }}/.ksa-assemblies/current/dll
        run: dotnet build src/AirDefence/AirDefence.csproj -c Release --nologo

      - name: Test
        if: env.HAVE_KEY == 'true'
        env:
          KSA_DLL_DIR: ${{ github.workspace }}/.ksa-assemblies/current/dll
        run: dotnet test tests/AirDefence.Tests/AirDefence.Tests.csproj --nologo

      - name: Validate parts and launch geometry
        if: env.HAVE_KEY == 'true'
        run: ./tools/validate-parts.py --offline

      # docs/KSA-API-SURFACE.md is what the upgrade-ksa skill diffs the game against, so it is
      # only worth anything if it matches the code. It is generated from the compiled assembly's
      # metadata, so this catches a new KSA dependency added without regenerating it.
      - name: KSA API surface is current
        if: env.HAVE_KEY == 'true'
        env:
          KSA_DLL_DIR: ${{ github.workspace }}/.ksa-assemblies/current/dll
        run: ./tools/api-surface.sh --check

      - name: Package
        if: env.HAVE_KEY == 'true'
        env:
          KSA_DLL_DIR: ${{ github.workspace }}/.ksa-assemblies/current/dll
        run: ./tools/package.sh

      - uses: actions/upload-artifact@v4
        if: env.HAVE_KEY == 'true'
        with:
          name: AirDefence-mod
          path: dist/*.zip
          if-no-files-found: error
