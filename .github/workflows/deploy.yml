name: Deploy

# Applies infra/services: Caddy and the feedback service on the VPS.
#
# It runs here rather than from a laptop for one specific reason: pulling the image needs a token
# with package read on this repository, and `secrets.GITHUB_TOKEN` is exactly that, issued per run
# and expiring with it. A personal token would have to be created, stored and rotated to do a job
# the runner already does for free.

on:
  # Called by release.yml rather than triggered by the release event: semantic-release publishes
  # with GITHUB_TOKEN, and GitHub does not raise workflow triggers from that token, so a
  # `release: published` trigger here would never once fire.
  workflow_call:
    inputs:
      image:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      image:
        description: "Image digest to deploy. Blank uses the latest build of this ref."
        required: false
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://api.ksarmory.com

    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5

      - name: Resolve the image
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          name="ghcr.io/$repo/feedback"

          if [[ -n "${{ inputs.image }}" ]]; then
            echo "ref=${{ inputs.image }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          token=$(curl -fsSL -u "${{ github.actor }}:$GH_TOKEN" \
            "https://ghcr.io/token?scope=repository:$repo/feedback:pull&service=ghcr.io" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')

          # The image is only rebuilt when services/feedback changes, so most commits have no
          # image of their own and falling back to latest is the normal path, not a failure.
          digest_of() {
            curl -sSL -o /dev/null -D - -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/$repo/feedback/manifests/$1" \
              | tr -d '\r' | awk '/^[Dd]ocker-[Cc]ontent-[Dd]igest:/ {print $2}'
          }

          for tag in "${{ github.sha }}" latest; do
            digest=$(digest_of "$tag")
            if [[ -n "$digest" ]]; then
              echo "resolved $tag -> $digest"
              # Deployed by digest either way, so what runs is pinned even when the tag moves.
              echo "ref=$name@$digest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "no image tagged $tag"
          done

          echo "::error::no image published at all -- run the Feedback image workflow first"
          exit 1

      - name: Resolve the oldest version reports are accepted from
        id: floor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # An override wins, for the case where the newest release is broken and reports about
          # it are exactly what is wanted.
          if [[ -n "${{ vars.MIN_MOD_VERSION }}" ]]; then
            echo "floor=${{ vars.MIN_MOD_VERSION }}" >> "$GITHUB_OUTPUT"
            echo "floor pinned to ${{ vars.MIN_MOD_VERSION }} by the MIN_MOD_VERSION variable"
            exit 0
          fi

          # Empty is not a failure: before the first release there is nothing to be behind.
          latest=$(gh release view -R "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || true)
          latest=${latest#v}

          echo "floor=$latest" >> "$GITHUB_OUTPUT"
          echo "floor is ${latest:-<none>}, from the newest release"

      - name: Install the deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # Some runners cannot open port 22 at all: the SYN is dropped before the VPS, which logs
      # neither an sshd connection nor a ufw block, while 80 and 443 stay reachable throughout.
      # It clears on its own, so the deploy waits it out rather than losing the release to it.
      - name: Wait for the VPS to accept SSH
        run: |
          for i in $(seq 1 10); do
            if timeout 20 bash -c 'exec 3<>/dev/tcp/45.133.178.13/22' 2>/dev/null; then
              echo "port 22 reachable on attempt $i"
              # Non-fatal: ssh_opts uses accept-new, so a missed scan degrades to trust-on-first-use.
              ssh-keyscan -T 15 -H 45.133.178.13 >> ~/.ssh/known_hosts 2>/dev/null || true
              exit 0
            fi
            echo "attempt $i: port 22 unreachable"
            sleep 30
          done
          echo "::error::45.133.178.13:22 stayed unreachable for five minutes"
          exit 1

      - name: Tofu init
        working-directory: infra/services
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ secrets.R2_BUCKET }}" \
            -backend-config="endpoints={s3=\"https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}" \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}"

      - name: Tofu apply
        working-directory: infra/services
        env:
          TF_VAR_feedback_image: ${{ steps.image.outputs.ref }}
          TF_VAR_ghcr_username: ${{ github.actor }}
          TF_VAR_ghcr_token: ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_github_token: ${{ secrets.KSARMORY_ISSUES_TOKEN }}
          TF_VAR_min_mod_version: ${{ steps.floor.outputs.floor }}
        # Reachable when the step above ran is not reachable when the provider opens its own
        # connection, so the apply retries too. It is idempotent, and a genuine configuration
        # error simply fails three times.
        run: |
          for i in 1 2 3; do
            tofu apply -auto-approve -input=false -lock-timeout=5m && exit 0
            echo "apply attempt $i failed"
            sleep 60
          done
          exit 1

      # Proves the thing that matters: TLS terminates and the service behind it answers.
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://api.ksarmory.com/health || echo 000)
            [[ "$code" == "200" ]] && { echo "healthy"; exit 0; }
            echo "attempt $i: HTTP $code"
            sleep 15
          done
          echo "::error::api.ksarmory.com/health never returned 200"
          exit 1
